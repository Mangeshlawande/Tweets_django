{% extends "layout.html" %}
{% block title %}Login · TweetBar{% endblock %}

{% block content %}
<div class="row">
    <div class="col-md-5 col-lg-4 mx-auto">
        <div class="tweet-card p-4">
            <div class="text-center mb-4">
                <i class="bi bi-twitter-x text-primary" style="font-size:2.5rem;"></i>
                <h4 class="fw-bold mt-2">Sign in to TweetBar</h4>
            </div>

            {% if form.errors %}
            <div class="alert alert-danger py-2">Invalid username or password.</div>
            {% endif %}

            <form method="post" novalidate>
                {% csrf_token %}
                <div class="mb-3">
                    <input type="text" name="username" class="form-control" placeholder="Username" autofocus required>
                </div>
                <div class="mb-4">
                    <input type="password" name="password" class="form-control" placeholder="Password" required>
                </div>
                <input type="hidden" name="next" value="{{ next }}">
                <button type="submit" class="btn btn-primary w-100">Log In</button>
            </form>

            <hr class="border-secondary my-4">
            <p class="text-center text-secondary mb-0">
                Don't have an account? <a href="{% url 'register' %}" class="text-primary">Sign up</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
